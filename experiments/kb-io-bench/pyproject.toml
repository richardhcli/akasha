[project]
name = "kbio"
version = "0.1.0"
description = "kb-io-bench: write/read/update benchmark for agent harnesses over a personal knowledge base"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "tiktoken>=0.7",
    "mcp>=2,<3",
    "pyyaml>=6",
    # basic-memory is the SOTA harness (conditions B and C); run from the pinned submodule
    "basic-memory",
    "rank-bm25>=0.2.2",
]

[project.scripts]
kbio = "kbio.cli:main"

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
basic-memory = { path = "third_party/basic-memory", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kbio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
