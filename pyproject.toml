[project]
name = "akasha"
version = "0.1.0"
description = "Personal Truth Maintenance System (pTMS) daemon"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "typer",
    "watchdog",
    "httpx",
]

# Optional: the system-tray presence (build-plan T12.5, vision.md Sec7.9
# "tray presence"). Deliberately NOT a core dependency -- `tray.py` lazy-
# imports pystray/Pillow itself and `akasha tray` is the only CLI command
# that needs them, so a plain `uv sync`/CLI-only install stays as light as
# it is today. Installed automatically inside the PyInstaller-packaged exe
# (scripts/windows/build-exe.ps1), which is the intended way most users
# reach this code path.
[project.optional-dependencies]
tray = ["pystray", "pillow"]

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "ruff",
    "pyright",
    "playwright",
    "pytest-playwright",
]
# Windows packaging only (build-plan T12.5) -- never required for `make
# check`/`make battery`, never imported by anything under src/akasha.
packaging = [
    "pyinstaller",
]

[project.scripts]
akasha = "akasha.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akasha"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
# S102: exec; S301/S302/S307: pickle/marshal/eval — banned everywhere (build-plan rule 0.5)
extend-select = ["S102", "S301", "S302", "S307"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
