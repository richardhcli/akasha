name: CI

on:
  push:
    branches: [main]
  pull_request:
  # T9.5/D3: nightly trigger for the soak below. GitHub Actions schedule
  # events always run against the default branch (main), matching the
  # build-plan Verify's "(nightly Windows)" parenthetical. D3: GitHub-hosted
  # runners hard-cap at 6h of execution time regardless of timeout-minutes,
  # so the schedule branch cannot literally run the build-plan Verify's 24h
  # -- it uses a 5h scaled proxy instead (T9.5's own Steps text explicitly
  # sanctions "a scaled proxy in CI ... nightly on main" as an alternative
  # reading), leaving ~1h margin under the 6h ceiling for runner
  # provisioning/checkout/`uv sync` overhead.
  schedule:
    - cron: "0 6 * * *"
  # Lets a maintainer manually exercise nightly-soak/nightly-battery on a
  # real hosted windows-latest runner without waiting for the cron trigger
  # (useful the first time this workflow reaches main, or after touching
  # either job -- both had literally never executed on a hosted runner
  # until manually dispatched to verify this). soak_hours only affects a
  # manual dispatch; the real nightly `schedule` run always uses the fixed
  # 5h duration (D3), never this input.
  workflow_dispatch:
    inputs:
      soak_hours:
        description: "Hours for nightly-soak on a manual dispatch only (schedule runs always use 5, D3)"
        required: false
        default: "0.05"

jobs:
  check:
    # Nightly `schedule` fires exist solely to drive `nightly-soak` below;
    # without this guard every other job would also silently re-run each
    # night and duplicate the push/PR suite for no reason.
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pyright src
      - run: uv run pytest tests/unit tests/property
      - run: uv run pytest tests/integration/test_openapi_snapshot.py

  windows-gate:
    if: github.event_name != 'schedule'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: echo "windows-latest leg of 'check' is the release gate (spec §3, §6.3)"

  ui-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run playwright install --with-deps chromium
      # Full UI loop end-to-end (T8.5) + the fast browser-free concurrency
      # regression guard (T8.5b, the per-request-connection fix).
      - run: uv run pytest tests/integration/test_ui_smoke.py tests/integration/test_concurrency.py

  plugin-build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-obsidian
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # T9.5: the soak test (build-plan Verify) on the `schedule` trigger. D3:
  # the build-plan's literal 24h cannot complete on a GitHub-hosted runner
  # (hard 6h execution cap, independent of timeout-minutes), so the
  # `schedule` branch runs a 5h scaled proxy instead -- see the `schedule`
  # trigger comment above for the full rationale. A shorter
  # workflow_dispatch-only override (see `on.workflow_dispatch.inputs.
  # soak_hours` above) separately lets a maintainer verify this job
  # actually runs on a real hosted windows-latest runner without waiting
  # up to 5h -- a real push/PR run must never block on either.
  nightly-soak:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run python tests/battery/soak.py --hours ${{ github.event_name == 'schedule' && '5' || inputs.soak_hours }}

  # Spec §6.3 names "battery + soak on main nightly (Windows)" as one gate;
  # nightly-soak above covered soak only -- this job was a dangling comment
  # ("Reserved for later milestones") until a 2026-07-24 real-Windows run
  # found 6 latent Windows bugs (E08/E12/E16 CRLF write-back corruption, the
  # single-instance-lock PermissionError leak, etc.) that this exact suite
  # would have caught on the very first nightly run, had it been wired.
  # windows-latest, matching the release-gate platform (spec §3) -- the
  # push/PR `check` job intentionally stays unit+property-only for fast
  # feedback; battery's real-filesystem/locking/CRLF assertions belong here.
  nightly-battery:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run pytest tests/battery
