name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run pyright src
      - run: uv run pytest tests/unit tests/property
      - run: uv run pytest tests/integration/test_openapi_snapshot.py

  windows-gate:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: echo "windows-latest leg of 'check' is the release gate (spec §3, §6.3)"

  plugin-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-obsidian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build

  # Reserved for later milestones:
  # - nightly-battery: `make battery` on a schedule trigger (wired at M5+)
  # - nightly-soak: long-running soak test (wired at M5+)
